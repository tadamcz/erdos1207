name = "Erdos1207"
version = "0.1.0"
defaultTargets = ["Challenge", "Solution", "Audit"]

# Pinned to the exact Mathlib the proof was written against: the v4.27.0 release (a3a10db0), reached
# in the benchmark through Formal Conjectures. See the README section "Toolchain and verification"
# for why this repository does not move to a later Mathlib.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "a3a10db0e9d66acbebf76c5e6a135066525ac900"

# The statement a reader audits: the benchmark statement, with the theorem left as `sorry`.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

# The AI-written proof. There is only one resolution, so it is this file rather than a library of
# separately imported modules; `Challenge` and `Solution` declare the same theorem in separate
# environments and are deliberately never imported together.
[[lean_lib]]
name = "Solution"
roots = ["Solution"]

# The audit (solution side): checks the proved theorem's statement, axioms and kind. The
# cross-environment statement comparison is done by `scripts/audit.sh`, which runs this too.
[[lean_lib]]
name = "Audit"
roots = ["Audit"]
